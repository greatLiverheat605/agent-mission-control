name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock', 'package-lock.json', 'rust-toolchain.toml') }}

      - name: Install test prerequisite
        shell: powershell
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force

      - name: Verify prerequisites
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/verify-prerequisites.ps1

      - name: Restore Node dependencies
        shell: powershell
        run: npm.cmd ci

      - name: Restore Rust dependencies
        shell: powershell
        run: cargo fetch --locked

      - name: Check Rust formatting
        shell: powershell
        run: cargo fmt --all -- --check

      - name: Lint Rust workspace
        shell: powershell
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings

      - name: Test Rust workspace
        shell: powershell
        run: cargo test --workspace --all-targets --locked --offline

      - name: Verify locked workspace metadata
        shell: powershell
        run: cargo metadata --locked --offline --no-deps --format-version 1

      - name: Verify workspace boundary
        shell: powershell
        run: node --test scripts/tests/workspace-boundaries.test.mjs

      - name: Test desktop renderer
        shell: powershell
        run: npm.cmd run test --workspace @mission-control/desktop

      - name: Typecheck desktop renderer
        shell: powershell
        run: npm.cmd run typecheck --workspace @mission-control/desktop

      - name: Build desktop renderer
        shell: powershell
        run: npm.cmd run build --workspace @mission-control/desktop

      - name: Prepare desktop E2E binaries
        shell: powershell
        run: npm.cmd run pretest:e2e --workspace @mission-control/desktop

      - name: Install Playwright browsers
        shell: powershell
        run: npx.cmd playwright install chromium

      - name: Run desktop E2E against freshly built binaries
        shell: powershell
        run: npx.cmd playwright test --config playwright.config.ts

      - name: Test package smoke failures
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Import-Module Pester -RequiredVersion 5.7.1 -Force; Invoke-Pester -Path 'scripts/tests/package-smoke.Tests.ps1' -CI"

      - name: Build unsigned Tauri package
        shell: powershell
        env:
          CARGO_NET_OFFLINE: "true"
        run: npm.cmd run tauri:build

      - name: Verify installed package
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/package-smoke.ps1
